document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-bottom:1px solid #EFE6D2;white-space:nowrap;vertical-align:top;\"><a href=\"{{r.waLink}}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:600;\">{{r.phone}}<\u002Fa><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:12px;border-bottom:1px solid #EFE6D2;vertical-align:top;max-width:220px;color:#6E6455;\">{{r.expIncome}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:12px;border-bottom:1px solid #EFE6D2;vertical-align:top;max-width:240px;color:#6E6455;\">{{r.cooking}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:12px;border-bottom:1px solid #EFE6D2;vertical-align:top;max-width:240px;color:#6E6455;\">{{r.comment}}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{showCards}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"border:1px solid #EFE6D2;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FFFDF8;\">\n              <div style=\"display:flex;align-items:center;gap:8px;\">\n                <span style=\"background:{{r.tagBg}};color:{{r.tagFg}};border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap;\">{{r.role}}<\u002Fspan>\n                <span style=\"margin-left:auto;color:#8A8072;font-size:12px;white-space:nowrap;\">{{r.time}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:600;line-height:1.3;\">{{r.name}}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6E6455;line-height:1.4;\">{{r.addr}}<\u002Fdiv>\n              <sc-for list=\"{{r.meta}}\" as=\"mr\" hint-placeholder-count=\"0\">\n                <div style=\"font-size:13px;color:#8A8072;line-height:1.45;\">{{mr.t}}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{r.hasPhone}}\" hint-placeholder-val=\"{{true}}\">\n                <a href=\"{{r.waLink}}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:#E9F6EC;color:#136B3B;font-weight:600;font-size:15px;margin-top:2px;\">Написать в WhatsApp · {{r.phone}}<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <sc-if value=\"{{eventsOn}}\" hint-placeholder-val=\"{{true}}\">\n      <section style=\"background:#FFF;border-radius:20px;padding:{{padCard}};display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(28,23,18,.06);margin-bottom:24px;\">\n        <div style=\"font-size:{{h2}};font-weight:700;\">Последние события<\u002Fdiv>\n        <div style=\"font-size:13px;color:#8A8072;margin-top:-6px;\">Клики и шаги пользователей — видно, где лиды не доходят до заявки<\u002Fdiv>\n        <sc-if value=\"{{noEvents}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"padding:20px;text-align:center;color:#8A8072;font-size:15px;\">Пока нет событий<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;\">\n          <sc-for list=\"{{evRows}}\" as=\"e\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;gap:2px;padding:9px 4px;border-bottom:1px solid #F4EDDD;\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;\">\n                <span style=\"color:#8A8072;white-space:nowrap;font-size:12px;\">{{e.time}}<\u002Fspan>\n                <span style=\"font-weight:600;font-size:14px;line-height:1.35;\">{{e.label}}<\u002Fspan>\n                <span style=\"margin-left:auto;color:#B7AC9B;font-size:11px;white-space:nowrap;display:{{sidDisp}};\">{{e.sid}}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{e.hasDetail}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"color:#8A8072;font-size:13px;line-height:1.4;\">{{e.detail}}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 860}, &quot;refreshSec&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 30, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 10, &quot;max&quot;: 300, &quot;unit&quot;: &quot;сек&quot;, &quot;section&quot;: &quot;Данные&quot;}, &quot;showEvents&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Данные&quot;}}\">\nconst EV_LABELS = {\n  page_view: 'Просмотр страницы', lang_ru: 'Переключил на русский', lang_kz: 'Переключил на казахский',\n  role_cook_click: 'Нажал «Я повар»', role_client_click: 'Нажал «Я клиент»',\n  form_start: 'Начал заполнять форму', district_pick: 'Выбрал район', other_address: 'Нажал «Другой адрес»',\n  cook_type: 'Отметил тип блюд', submit_cook: 'Отправил заявку (повар)', submit_client: 'Отправил заявку (клиент)',\n  wa_open: 'Открыл WhatsApp', share_whatsapp: 'Поделился в WhatsApp', share_telegram: 'Поделился в Telegram', share_copy: 'Скопировал ссылку'\n};\nconst DEFAULT_EP = 'https://script.google.com/macros/s/AKfycbzbs_UqBQSqgnZJH2S3OQ-LBv60AmQIZtoA8j3S6zJLxekJ6KtVPdgYm3M8X3JN2aT7/exec';\n\nclass Component extends DCLogic {\n  state = { ep: '', leads: [], events: [], filter: 'all', q: '', status: 'Загружаю…', loading: false, remote: false, mobile: false, showEp: false };\n\n  refreshMs() { const s = parseInt(this.props.refreshSec, 10); return (isNaN(s) ? 30 : Math.max(10, s)) * 1000; }\n  refreshSecLabel() { return Math.round(this.refreshMs() / 1000); }\n\n  componentDidMount() {\n    let ep = DEFAULT_EP;\n    try { ep = localStorage.getItem('korshi_admin_endpoint') || DEFAULT_EP; } catch (e) {}\n    const st = { ep };\n    try {\n      const cached = JSON.parse(localStorage.getItem('korshi_admin_cache') || 'null');\n      if (cached && Array.isArray(cached.leads)) {\n        st.leads = cached.leads; st.events = cached.events || []; st.remote = true;\n        st.status = 'Сохранённые данные от ' + this.fmtTime(cached.t) + ' — обновляю из Google Таблицы…';\n      }\n    } catch (e) {}\n    this.mq = window.matchMedia('(max-width: 720px)');\n    st.mobile = this.mq.matches;\n    this.onMq = () => this.setState({ mobile: this.mq.matches });\n    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMq); else this.mq.addListener(this.onMq);\n    this.setState(st, () => this.load(true));\n    this.timer = setInterval(() => { if (!document.hidden && this.state.ep.trim()) this.load(true); }, this.refreshMs());\n    this.onVis = () => { if (!document.hidden && this.state.ep.trim()) this.load(true); };\n    document.addEventListener('visibilitychange', this.onVis);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    document.removeEventListener('visibilitychange', this.onVis);\n    if (this.mq) { if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq); else this.mq.removeListener(this.onMq); }\n  }\n\n  loadLocal() {\n    let leads = [], events = [];\n    try {\n      leads = JSON.parse(localStorage.getItem('korshi_leads') || '[]');\n      events = JSON.parse(localStorage.getItem('korshi_events') || '[]');\n    } catch (e) {}\n    this.setState({\n      leads, events, remote: false, loading: false,\n      status: leads.length || events.length\n        ? 'Показаны данные, сохранённые в этом браузере (' + leads.length + ' заявок). Для общих данных вставьте ссылку Apps Script.'\n        : 'Нет связи с Google Таблицей. Проверьте интернет и нажмите «Обновить».'\n    });\n  }\n\n  rowsToObjects(arr, map) {\n    if (!Array.isArray(arr) || arr.length < 2) return [];\n    return arr.slice(1).map(r => { const o = {}; Object.keys(map).forEach(k => { o[k] = r[map[k]] != null ? String(r[map[k]]) : ''; }); return o; });\n  }\n\n  normPhone(p) {\n    let d = String(p || '').replace(/\\D/g, '');\n    if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);\n    if (d.length === 10) d = '7' + d;\n    return d;\n  }\n  fmtPhone(p) {\n    const d = this.normPhone(p);\n    if (d.length !== 11) return String(p || '').trim() || '—';\n    return '+7 ' + d.slice(1, 4) + ' ' + d.slice(4, 7) + ' ' + d.slice(7, 9) + ' ' + d.slice(9, 11);\n  }\n\n  async load(silent) {\n    const ep = this.state.ep.trim();\n    if (!ep) { this.loadLocal(); return; }\n    if (this.state.loading) return;\n    this.setState({ loading: true, status: silent && this.state.remote ? this.state.status : 'Загружаю данные из Google Таблицы…' });\n    const ctrl = new AbortController();\n    const to = setTimeout(() => ctrl.abort(), 20000);\n    try {\n      const res = await fetch(ep, { signal: ctrl.signal });\n      const data = await res.json();\n      clearTimeout(to);\n      const leads = this.rowsToObjects(data.leads, { ts: 0, role: 1, name: 2, city: 3, district: 4, addr_other: 5, phone: 6, exp: 7, income: 8, cooking: 9, cook_free: 10, comment: 11, lang: 12, sid: 13 })\n        .map(o => ({ ...o, role: o.role === 'Повар' ? 'cook' : 'client', phone: o.phone.replace(/^'/, '') }));\n      const events = this.rowsToObjects(data.events, { ts: 0, ev: 1, role: 2, lang: 3, v: 4, sid: 5 });\n      const fresh = this.state.remote && leads.length > this.state.leads.length ? '+' + (leads.length - this.state.leads.length) + ' новых! · ' : '';\n      try { localStorage.setItem('korshi_admin_cache', JSON.stringify({ leads, events, t: Date.now() })); } catch (e) {}\n      this.setState({ leads, events, remote: true, loading: false, status: fresh + leads.length + ' заявок, ' + events.length + ' событий · обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' · автообновление каждые ' + this.refreshSecLabel() + ' сек' });\n    } catch (err) {\n      clearTimeout(to);\n      if (this.state.remote) {\n        this.setState({ loading: false, status: 'Не удалось обновить — показаны последние загруженные данные. Попробую снова через ' + this.refreshSecLabel() + ' сек.' });\n      } else {\n        this.setState({ loading: false });\n        this.loadLocal();\n      }\n    }\n  }\n\n  fmtTime(ts) {\n    const d = new Date(ts);\n    if (isNaN(d)) return String(ts).slice(0, 16);\n    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });\n  }\n\n  filtered() {\n    const s = this.state;\n    let rows = s.leads.slice().reverse();\n    if (s.filter !== 'all') rows = rows.filter(l => l.role === s.filter);\n    const q = s.q.trim().toLowerCase();\n    if (q) rows = rows.filter(l => [l.name, l.district, l.addr_other, l.phone, l.comment, l.cooking, l.cook_free].join(' ').toLowerCase().includes(q));\n    return rows;\n  }\n\n  exportCsv() {\n    const cols = ['Время', 'Роль', 'Имя', 'Город', 'Район', 'Другой адрес', 'Телефон', 'Опыт', 'Заработок', 'Что готовит', 'Своими словами', 'Комментарий', 'Язык'];\n    const esc = v => '\"' + String(v || '').replace(/\"/g, '\"\"') + '\"';\n    const lines = [cols.map(esc).join(';')].concat(this.state.leads.map(l =>\n      [l.ts, l.role === 'cook' ? 'Повар' : 'Клиент', l.name, l.city || 'Астана', l.district, l.addr_other, '+' + this.normPhone(l.phone), l.exp, l.income, l.cooking, l.cook_free, l.comment, l.lang].map(esc).join(';')\n    ));\n    const blob = new Blob(['\\uFEFF' + lines.join('\\n')], { type: 'text/csv;charset=utf-8' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'korshi-заявки.csv';\n    a.click();\n  }\n\n  renderVals() {\n    const s = this.state, m = s.mobile;\n    const evCount = (name) => s.events.filter(e => (e.ev || '') === name).length;\n    const uniq = (name) => new Set(s.events.filter(e => (e.ev || '') === name).map(e => e.sid)).size;\n    const pv = uniq('page_view') || evCount('page_view');\n    const pct = (n) => pv ? Math.round(n / pv * 100) + '% от просмотров' : '';\n    const submits = evCount('submit_cook') + evCount('submit_client');\n    const funnelData = [\n      { label: 'Просмотры страницы', value: pv, sub: 'уникальные посетители', hot: false },\n      { label: 'Нажали «Я повар»', value: uniq('role_cook_click'), sub: pct(uniq('role_cook_click')), hot: true },\n      { label: 'Нажали «Я клиент»', value: uniq('role_client_click'), sub: pct(uniq('role_client_click')), hot: false },\n      { label: 'Начали форму', value: uniq('form_start'), sub: pct(uniq('form_start')), hot: false },\n      { label: 'Отправили заявку', value: submits, sub: pct(submits), hot: true },\n      { label: 'Открыли WhatsApp', value: evCount('wa_open'), sub: pct(evCount('wa_open')), hot: false }\n    ];\n    const rows = this.filtered().map(l => {\n      const addr = [l.city && l.city !== 'Астана' ? l.city : '', l.district, l.addr_other].filter(Boolean).join(' · ');\n      const digits = this.normPhone(l.phone);\n      const expIncome = [l.exp, l.income].filter(Boolean).join(' · ');\n      const cooking = [l.cooking, l.cook_free].filter(Boolean).join(' · ');\n      const meta = [];\n      if (expIncome) meta.push({ t: 'Опыт/заработок: ' + expIncome });\n      if (cooking) meta.push({ t: 'Готовит: ' + cooking });\n      if (l.comment) meta.push({ t: '«' + l.comment + '»' });\n      return {\n        time: this.fmtTime(l.ts),\n        role: l.role === 'cook' ? 'Повар' : 'Клиент',\n        tagBg: l.role === 'cook' ? '#FDECE4' : '#171310', tagFg: l.role === 'cook' ? '#C43D12' : '#FFF',\n        name: l.name || '—', addr: addr || '—',\n        phone: this.fmtPhone(l.phone), hasPhone: digits.length >= 10,\n        waLink: 'https://wa.me/' + digits,\n        expIncome: expIncome || '—', cooking: cooking || '—', comment: l.comment || '—',\n        meta\n      };\n    });\n    const seg = (on) => ({ bg: on ? '#171310' : 'transparent', fg: on ? '#FFF' : '#6E6455' });\n    const a = seg(s.filter === 'all'), c = seg(s.filter === 'cook'), k = seg(s.filter === 'client');\n    return {\n      headerPad: m ? '10px 14px' : '14px 24px', h1: m ? '17px' : '19px',\n      padMain: m ? '12px' : '24px', gapMain: m ? '12px' : '20px', padCard: m ? '14px' : '20px',\n      h2: m ? '17px' : '19px', numFs: m ? '26px' : '30px',\n      funnelCols: m ? 'repeat(2,1fr)' : 'repeat(auto-fit,minmax(150px,1fr))',\n      gapFunnel: m ? '8px' : '12px', padFunnel: m ? '12px' : '16px',\n      qMin: m ? '100%' : '220px', sidDisp: m ? 'none' : 'inline',\n      showTable: rows.length > 0 && !m, showCards: rows.length > 0 && m,\n      epVal: s.ep,\n      onEp: (e) => { this.setState({ ep: e.target.value }); try { localStorage.setItem('korshi_admin_endpoint', e.target.value); } catch (err) {} },\n      refresh: () => this.load(false),\n      refreshLabel: s.loading ? 'Обновляю…' : 'Обновить',\n      statusLine: s.status,\n      sourceLabel: s.remote ? 'Google Таблица · авто ' + this.refreshSecLabel() + ' сек' : 'локальные данные',\n      showEp: s.showEp,\n      toggleEp: () => this.setState({ showEp: !s.showEp }),\n      epToggleLabel: s.showEp ? 'Скрыть ссылку' : 'Ссылка на данные',\n      funnel: funnelData.map(f => ({\n        ...f, value: String(f.value),\n        bg: f.hot ? '#FDECE4' : '#FFF', bd: f.hot ? '#F3C7AE' : '#EFE6D2',\n        numColor: f.hot ? '#C43D12' : '#1C1712', labelColor: f.hot ? '#B23A10' : '#8A8072'\n      })),\n      nAll: String(s.leads.length),\n      nCook: String(s.leads.filter(l => l.role === 'cook').length),\n      nClient: String(s.leads.filter(l => l.role === 'client').length),\n      fAll: () => this.setState({ filter: 'all' }), fCook: () => this.setState({ filter: 'cook' }), fClient: () => this.setState({ filter: 'client' }),\n      allBg: a.bg, allFg: a.fg, cookBg: c.bg, cookFg: c.fg, clientBg: k.bg, clientFg: k.fg,\n      qVal: s.q, onQ: (e) => this.setState({ q: e.target.value }),\n      exportCsv: () => this.exportCsv(),\n      rows, noLeads: rows.length === 0,\n      emptyMsg: s.leads.length === 0 ? 'Заявок пока нет. Они появятся здесь после первых отправок формы на сайте.' : 'Ничего не найдено по фильтру.',\n      eventsOn: (this.props.showEvents ?? true) === true || this.props.showEvents === 'true',\n      evRows: s.events.slice().reverse().slice(0, 40).map(e => ({\n        time: this.fmtTime(e.ts),\n        label: EV_LABELS[e.ev] || e.ev || '—',\n        detail: e.v || '', hasDetail: !!e.v, sid: e.sid || ''\n      })),\n      noEvents: s.events.length === 0\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
